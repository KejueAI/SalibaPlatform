services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - vauto_uploads:/home/vauto/uploads
      - vauto_archive:/home/vauto/archive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vauto_uploads:
  vauto_archive:
